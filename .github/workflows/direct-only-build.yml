name: Direct Only S26 APK
on:
  push:
    branches:
      - direct-only-android-build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract Direct Only app
        run: mkdir -p direct-only-project && unzip -q direct-only-source.zip -d direct-only-project
      - name: Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon -p direct-only-project :app:assembleDebug --stacktrace
      - name: Upload Direct Only APK
        uses: actions/upload-artifact@v4
        with:
          name: DirectOnly-S26-install-APK
          path: direct-only-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Five Minute Guard APK

on:
  push:
    branches: [ five-minute-guard-build ]
  workflow_dispatch:

concurrency:
  group: five-minute-guard-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and patch source
        shell: bash
        run: |
          set -euo pipefail
          cat five-minute-guard/parts/part00 \
              five-minute-guard/parts/part01 \
              five-minute-guard/parts/part02 \
              five-minute-guard/parts/part03 \
              five-minute-guard/parts/part04 \
              five-minute-guard/parts/part05 > /tmp/FiveMinuteGuard.b64
          test "$(wc -c < /tmp/FiveMinuteGuard.b64)" -eq 29520
          base64 -d /tmp/FiveMinuteGuard.b64 > /tmp/FiveMinuteGuard-source.zip
          unzip -t /tmp/FiveMinuteGuard-source.zip
          rm -rf /tmp/fmguard-src
          mkdir -p /tmp/fmguard-src
          unzip -q /tmp/FiveMinuteGuard-source.zip -d /tmp/fmguard-src
          base64 -d five-minute-guard/fmg-v1.2.patch.b64 > /tmp/fmg-v1.2.patch
          patch -d /tmp/fmguard-src -p1 < /tmp/fmg-v1.2.patch
          grep -q "versionName '1.2'" /tmp/fmguard-src/FiveMinuteGuard/app/build.gradle
          grep -q "Home DM button must not exempt feed time" /tmp/fmguard-src/FiveMinuteGuard/app/src/test/java/com/marcel/fiveminuteguard/ScreenClassifierSelfTest.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run classifier regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fmg-tests
          javac -d /tmp/fmg-tests \
            /tmp/fmguard-src/FiveMinuteGuard/app/src/main/java/com/marcel/fiveminuteguard/NodeSignal.java \
            /tmp/fmguard-src/FiveMinuteGuard/app/src/main/java/com/marcel/fiveminuteguard/ScreenClassifier.java \
            /tmp/fmguard-src/FiveMinuteGuard/app/src/test/java/com/marcel/fiveminuteguard/ScreenClassifierSelfTest.java
          java -cp /tmp/fmg-tests com.marcel.fiveminuteguard.ScreenClassifierSelfTest

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: /tmp/fmguard-src/FiveMinuteGuard
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          src="/tmp/fmguard-src/FiveMinuteGuard/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$src"
          mkdir -p output
          cp "$src" output/FiveMinuteGuard-v1.2.apk
          test -s output/FiveMinuteGuard-v1.2.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose output/FiveMinuteGuard-v1.2.apk
          sha256sum output/FiveMinuteGuard-v1.2.apk | tee output/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiveMinuteGuard-v1.2-APK
          path: |
            output/FiveMinuteGuard-v1.2.apk
            output/SHA256.txt
          if-no-files-found: error

name: Build WINSUNG APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout WINSUNG build repo
        uses: actions/checkout@v4

      - name: Checkout Jovanovski Windows Launcher v2.1.0
        run: |
          git clone --depth 1 --branch v2.1.0 https://github.com/jovanovski/windowslauncher.git upstream

      - name: Apply WINSUNG modifications
        run: python3 scripts/prepare_source.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Make Gradle wrapper executable
        run: chmod +x upstream/gradlew

      - name: Build installable debug APK
        working-directory: upstream
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp upstream/app/build/outputs/apk/debug/app-debug.apk output/WINSUNG98-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WINSUNG98-APK
          path: output/WINSUNG98-debug.apk
          if-no-files-found: error
